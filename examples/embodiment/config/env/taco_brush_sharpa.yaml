env_type: taco

# Simulator backend: "cpu" (threaded CPU MuJoCo, original implementation) or
# "gpu" (MuJoCo Warp, batched worlds on one CUDA device). Both backends are
# robot-agnostic and the gpu path is smoke-tested for sharpa (see
# yjw_scripts/smoke_test_taco_gpu_sharpa.py). Defaults to cpu because the
# flow-policy checkpoint was tracked on CPU MuJoCo and mjwarp contacts are only
# numerically close, not bit-identical; tune gpu_nconmax_per_env on the gpu path.
sim_backend: cpu
gpu_cuda_graph: True
gpu_nconmax_per_env: 100
gpu_njmax_per_env: 350

# Robot hand: selects the qpos layout + asset materialization (see
# rlinf/envs/taco/robots.py). sharpa = 56 hand dofs + 2 free-joint objects.
robot: sharpa

# ------------------------------------------------------------------ dataset
# Each episode folder = one scene (env) instance: scene.xml + objects/ +
# trajectory_*.npz + pointcloud/.
dataset_root: /root/Data/taco-brush-sharpa
# sharpa STL meshes referenced by scene.xml (meshdir=../../../assets/), vendored
# in-repo so no external asset path is needed. The dataset scenes reference 6
# fingertip meshes by a baked shared-geometry naming that robots.py bridges to
# these per-finger files via symlink aliases. EMBODIED_PATH is exported by the
# run scripts (= <repo>/examples/embodiment).
robot_assets_root: ${oc.env:EMBODIED_PATH}/assets/robots/sharpa/meshes
# Legacy key (unused when robot_assets_root is set).
allegro_assets_root: /root/Spider/spider/assets/robots/allegro/assets
# Where the Spider "processed" symlink layout is materialized at runtime.
scene_root: /tmp/taco_scene_root
# Demo trajectory variant. trajectory_mpc_30hz.npz is the MPC-tracked 56-dim
# sharpa trajectory the flow-policy checkpoint was trained on (its action_key).
trajectory_file: trajectory_mpc_30hz.npz

# Episode selection (null = all 415 episodes).
episodes: null            # explicit list of episode folder names
categories: null          # filter by verb__tool__target categories
one_per_category: False   # keep one (deterministic) episode per category
max_episodes: null

# ----------------------------------------------- obs contract (match the ckpt!)
# These must match the flow-policy checkpoint's shape_meta.
obs_mode: pc2_qpos        # pc_qpos | pc2_qpos
obs_horizon: 16           # To
num_points: 512           # K points per cloud (FPS, deterministic seed 0)

# ------------------------------------------------------------------ episode
total_num_envs: null
auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 160
max_episode_steps: 160    # control steps @30Hz; per-episode cap is min(this, T_demo-1)
success_threshold_m: 0.1  # tool tracking success at episode end (metric only)

seed: 0
group_size: 1
use_fixed_reset_state_ids: True
is_eval: False

num_threads: 0            # physics thread pool; 0 -> min(num_envs, 16)

# ------------------------------------------------------------------- reward
# Pluggable (rlinf/envs/taco/rewards.py): tracking | zero | vlm_judge (TBD).
reward:
  type: tracking
  tool_pos_weight: 1.0
  target_pos_weight: 1.0
  hand_qpos_weight: 0.1
  tool_pos_scale: 0.05    # meters
  target_pos_scale: 0.05  # meters
  hand_qpos_scale: 0.5    # radians
  # Contact-consistency term (anti reward-hacking; CPU backend only).
  contact_weight: 0.0
  contact_dist_tol: 1.0e-3 # a contact counts as touching when dist < tol (m)

# -------------------------------------- DeepMimic training aids (default off)
rsi: # Reference State Initialization: start episodes at random demo frames
  enabled: False
  min_remaining_steps: 8 # never start within this many steps of the demo end
  contact_pos_threshold_m: 1.0e-3 # object "starts moving" when displaced > this (m) from demo frame 0
  contact_object: earliest # earliest | tool | target -- which object's first motion bounds sampling
early_termination: # end episodes on unrecoverable failure
  enabled: False
  criteria: ["hand_object_distance"] # and/or "object_tracking"
  min_steps: 8 # grace period (control steps) after each (re)set
  hand_object_dist_threshold: 0.10 # sim minus demo palm-object distance (m)
  object_err_threshold: 0.10

# ---------------------------------- single-step (contextual-bandit) RL (off)
single_step:
  enabled: False
  hand_obs_noise_std: 0.0
  perturb_init_hand: False
  min_frame: 0 # never sample t below this demo frame

# -------------------------------- demo-start short-horizon curriculum RL (off)
demo_start:
  enabled: False
  hand_obs_noise_std: 0.0
  perturb_init_hand: False
  min_frame: 0

# EnvWorker-side effective horizon schedule (default off).
horizon_curriculum:
  enabled: False
  collect_current_horizon_only: True
  sample_to_global_batch_multiple: True
  max_train_global_batches_per_step: null
  start_horizon: 1
  end_horizon: ${env.train.max_episode_steps}
  milestones: []

# ------------------------------------------------------------------- video
video_cfg:
  save_video: False
  info_on_video: False
  video_base_dir: ${runner.logger.log_path}/video/train
video_num_envs: 4
render_height: 240
render_width: 320
