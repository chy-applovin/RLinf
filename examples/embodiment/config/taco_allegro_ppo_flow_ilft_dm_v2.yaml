# Anti-reward-hacking v2 of the IL-finetune + DeepMimic recipe.
#
# The step-1000 evals of BOTH IL-finetune runs (ilft / ilft+DM) showed PPO
# converging to "hover near the brush but never grasp": on this episode an
# untouched brush tracks the demo better (window err 0.158 m / final 0.033 m)
# than the IL policy's imperfect brushing (0.191 / 0.085), so not grasping
# was the optimum of the (mis-specified) pure pose-tracking reward.
# Two fixes, exactly as diagnosed (see taco_allegro/README.md):
#
#   1. early_termination.object_err_threshold 0.25 -> 0.10: an untouched
#      brush deviates >0.10 m from the demo mid-window, so "never grasp"
#      episodes now terminate around the manipulation phase -> hacking
#      becomes unprofitable; 0.25 exceeded the demo's own peak displacement
#      (0.178 m) and could never fire on this failure mode.
#   2. reward.contact_weight 0.0 -> 0.5 (contact-consistency term, cf.
#      Spider's contact reward): when the aligned demo frame has hand-object
#      contact, the sim only earns this term by ACTUALLY touching
#      (right hand<->tool, left hand<->target). Hovering forfeits
#      0.5/2.6 ~= 0.19 r/step over the whole contact window - an order of
#      magnitude more than the ~0.07 r/step the hack used to gain.
#
# Everything else (IL init epoch_800.pt, object-dominant tracking weights,
# RSI + both ET criteria, single episode, PPO hyperparams, 1000 steps,
# ckpt every 200) is unchanged from taco_allegro_ppo_flow_ilft_dm.yaml.

defaults:
  - env/taco_brush_allegro@env.train
  - env/taco_brush_allegro@env.eval
  - model/flow_policy_taco@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: taco-allegro-flow-rl
    experiment_name: "ilft-ppo-dm-v2-contact-et010-1ep-brush_bowl"
    logger_backends: ["wandb", "tensorboard"]
    wandb_tags: ["il-finetune", "deepmimic", "anti-reward-hacking"]
    wandb_notes: |
      Anti-reward-hacking v2 of ilft-ppo-dm (PPO fine-tune of flow-policy
      epoch_800.pt on the single TACO scene brush__brush__bowl__20230927_027).
      Step-1000 evals of runs 58erpa3a/73hk83x4 showed the policy hacking the
      pure pose-tracking reward by hovering without grasping (untouched brush
      tracks better than imperfect brushing on this episode). Two fixes vs
      ilft-ppo-dm (everything else identical):
      (1) ET object_err_threshold 0.25 -> 0.10 m: "never grasp" now
      terminates mid-manipulation-window instead of surviving the episode;
      (2) NEW contact-consistency reward term, weight 0.5 (vs tool 1.0 /
      target 1.0 / hand 0.1, normalized): when the aligned demo frame has
      hand-object contact, the sim earns the term only by actually touching
      (right hand<->tool, left hand<->target) - hovering forfeits
      ~0.19 r/step across the contact window.
      Setup: RSI + ET(hand_object_distance, object_tracking), 64 CPU-MuJoCo
      envs x 160 steps, flow_sde noise 0.5, lr 1e-5 / value_lr 1e-4 with
      critic warmup, 1000 steps, ckpt every 200, GPUs 0-3.

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 200

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 10.0
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    sim_backend: cpu
    total_num_envs: 64
    episodes: ["brush__brush__bowl__20230927_027"]
    max_episode_steps: 160
    max_steps_per_rollout_epoch: 160
    reward:
      type: tracking
      tool_pos_weight: 1.0   # objects are the dominant reward factors
      target_pos_weight: 1.0
      hand_qpos_weight: 0.1  # hand term only as a mild shaping prior
      tool_pos_scale: 0.05
      target_pos_scale: 0.05
      hand_qpos_scale: 0.5
      # FIX 2: contact-consistency term - demo-in-contact frames pay off only
      # if the sim hand actually touches the object (anti-hover).
      contact_weight: 0.5
      contact_dist_tol: 1.0e-3
    rsi:
      enabled: True
      min_remaining_steps: 16
    early_termination:
      enabled: True
      criteria: ["hand_object_distance", "object_tracking"]
      min_steps: 8
      hand_object_dist_threshold: 0.10
      # FIX 1: 0.25 -> 0.10 (must be below the demo's own peak brush
      # displacement of 0.178 m; an untouched brush errs ~0.158 m mid-window)
      object_err_threshold: 0.10
  eval: # unused (val_check_interval=-1)
    sim_backend: cpu
    total_num_envs: 16
    episodes: ["brush__brush__bowl__20230927_027"]
    max_episode_steps: 160
    max_steps_per_rollout_epoch: 160
    group_size: 1
    is_eval: True
    seed: 1000

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 2560 # = 64 envs x 40 chunk steps
  seed: 42
  enable_offload: False

  model:
    model_path: "/root/flow-policy/outputs/flow-policy/2026-06-10/18-12-14/checkpoints/epoch_800.pt"
    random_init: False # RL fine-tuning from the IL weights
    num_action_chunks: 4
    add_value_head: True
    noise_method: "flow_sde"
    noise_level: 0.5

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 20 # 20 optimizer steps = ~5 global steps critic-only

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
