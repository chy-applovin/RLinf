# From-scratch PPO sanity experiment:
#   - architecture / IO identical to the IL flow-matching policy, but the
#     transformer weights are RANDOMLY initialized (random_init: True; the
#     checkpoint provides only shape_meta + normalizer stats);
#   - real TACO scene as RL env (single episode: brush__brush__bowl__20230927_027);
#   - dense tracking reward against trajectory_ctrl_30hz_im.npz qpos;
#   - PPO (actor_critic + GAE), checkpoints every save_interval steps;
#   - synced to the wandb project "taco-allegro-flow-rl".
#
# Sized for 8 GPUs: 64 envs x 160 steps (40 chunks of 4) per rollout epoch.

defaults:
  - env/taco_brush_allegro@env.train
  - env/taco_brush_allegro@env.eval
  - model/flow_policy_taco@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: taco-allegro-flow-rl
    experiment_name: "scratch-ppo-tracking-1ep-brush_bowl"
    logger_backends: ["wandb", "tensorboard"]

  max_epochs: 300
  max_steps: -1

  only_eval: False
  val_check_interval: 50 # deterministic (flow_ode) eval on the same episode
  save_interval: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 10.0
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 64
    episodes: ["brush__brush__bowl__20230927_027"]
    max_episode_steps: 160
    max_steps_per_rollout_epoch: 160
  eval:
    total_num_envs: 16
    episodes: ["brush__brush__bowl__20230927_027"]
    max_episode_steps: 160
    max_steps_per_rollout_epoch: 160
    group_size: 1
    is_eval: True
    seed: 1000
    video_cfg:
      save_video: False
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 2560 # = 64 envs x 40 chunk steps
  seed: 42
  enable_offload: False

  model:
    # checkpoint used ONLY as architecture/IO spec (shape_meta + normalizer);
    # weights stay randomly initialized.
    model_path: "/root/flow-policy/outputs/flow-policy/2026-06-10/18-12-14/checkpoints/best.pt"
    random_init: True
    num_action_chunks: 4
    add_value_head: True
    noise_method: "flow_sde"
    noise_level: 0.5

  optim:
    # from-scratch small transformer: IL-scale lr instead of fine-tune lr
    lr: 3.0e-4
    value_lr: 1.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
