# From-scratch PPO, HAND-ONLY tracking reward:
#   - random-init policy (architecture/IO from the IL checkpoint, fresh weights);
#   - reward follows ONLY the demo hand qpos: tool/target object terms zeroed
#     (r = exp(-mean|hand_qpos - demo_hand_qpos| / 0.5), bounded (0, 1]);
#   - accelerated experiment loop: no eval, 1000 steps, checkpoint every 200;
#   - sim_backend: cpu (benchmark in taco_allegro/README.md: GPU/mjwarp backend
#     is implemented but slower on this machine - driver 12.2 blocks CUDA graphs).

defaults:
  - env/taco_brush_allegro@env.train
  - env/taco_brush_allegro@env.eval
  - model/flow_policy_taco@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: taco-allegro-flow-rl
    experiment_name: "scratch-ppo-handonly-1ep-brush_bowl"
    logger_backends: ["wandb", "tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1 # no eval during training
  save_interval: 200

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 10.0
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    sim_backend: cpu
    total_num_envs: 64
    episodes: ["brush__brush__bowl__20230927_027"]
    max_episode_steps: 160
    max_steps_per_rollout_epoch: 160
    reward:
      type: tracking
      tool_pos_weight: 0.0   # hand-only: ignore the tool object
      target_pos_weight: 0.0 # hand-only: ignore the target object
      hand_qpos_weight: 1.0
      hand_qpos_scale: 0.5
  eval: # unused (val_check_interval=-1), kept for config completeness
    sim_backend: cpu
    total_num_envs: 16
    episodes: ["brush__brush__bowl__20230927_027"]
    max_episode_steps: 160
    max_steps_per_rollout_epoch: 160
    group_size: 1
    is_eval: True
    seed: 1000
    reward:
      type: tracking
      tool_pos_weight: 0.0
      target_pos_weight: 0.0
      hand_qpos_weight: 1.0
      hand_qpos_scale: 0.5

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 2560 # = 64 envs x 40 chunk steps
  seed: 42
  enable_offload: False

  model:
    model_path: "/root/flow-policy/outputs/flow-policy/2026-06-10/18-12-14/checkpoints/best.pt"
    random_init: True
    num_action_chunks: 4
    add_value_head: True
    noise_method: "flow_sde"
    noise_level: 0.5

  optim:
    lr: 3.0e-4
    value_lr: 1.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
