defaults:
  - env/taco_brush_allegro@env.train
  - env/taco_brush_allegro@env.eval
  - model/flow_policy_taco@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 2-3

runner:
  task_type: embodied
  logger:
    log_path: "/root/RLinf/logs/sharpa20hz-tp4-helmet-retadv-f20-h35-gbs128"
    project_name: taco-allegro-flow-rl
    experiment_name: "sharpa20hz-tp4-helmet-retadv-f20-h35-gbs128"
    logger_backends: ["wandb", "tensorboard"]
    wandb_tags: ["sharpa20hz", "tp4", "f20", "h35", "fixed-demo-start", "object-hand-tracking", "return_as_adv", "brush__brush__helmet__20231027_011"]
    wandb_notes: |
      Sharpa 20Hz Tp=4 RL fixed-demo-start run. Episode=brush__brush__helmet__20231027_011; algo=PPO_with_return_as_adv (critic-free return-to-go advantages, no value head).
      Initial IL checkpoint: /root/flow-policy/outputs/flow-policy/sharpa20hz_tp4/checkpoints/epoch_4100.pt.
      Reset initializes the full simulator state from demo frame 20 using demo_start.fixed_frame=20.
      The initial observation history is demo frames 17-20 (obs_horizon=4), matching the IL history contract.
      True env episode cap is max_episode_steps=35 control steps. Because action chunk=4,
      max_steps_per_rollout_epoch=36 requests 9 chunk slots; the final slot after env done is a no-op.
      Reward tracks tool object, target object, and hand qpos with weights 1/1/1. Dataset=/root/Data/taco-brush-sharpa-20hz-both. GPUs 2-3.

  max_epochs: 5000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 500

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: ppo_return_as_adv
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 10.0
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    sim_backend: cpu
    total_num_envs: 128
    dataset_root: /root/Data/taco-brush-sharpa-20hz-both
    allegro_assets_root: /root/Data/sharpa_mesh/meshes
    robot_name: sharpa
    robot_asset_glob: "*.STL"
    robot_asset_aliases:
      DP_HB1_4F.STL: right_DP.STL
      DP_visual_HB1_4F.STL: right_DP_visual.STL
      DP_HB1_TH.STL: right_thumb_DP.STL
      DP_Visual_HB1_TH.STL: right_thumb_DP_visual.STL
      elastomer_HB1_4F.STL: elastomer.STL
      elastomer_HB1_TH.STL: thumb_elastomer.STL
    trajectory_file: trajectory_mpc_20hz.npz
    pointcloud_dir: 20hz_mpc_pointcloud
    obs_horizon: 4
    hand_dim: 56
    episodes: ["brush__brush__helmet__20231027_011"]
    max_episode_steps: 35
    max_steps_per_rollout_epoch: 36
    ignore_terminations: False
    reward:
      type: tracking
      tool_pos_weight: 1.0
      target_pos_weight: 1.0
      hand_qpos_weight: 1.0
      tool_pos_scale: 0.05
      target_pos_scale: 0.05
      hand_qpos_scale: 0.35
      contact_weight: 0.0
    single_step:
      enabled: False
    demo_start:
      enabled: True
      hand_obs_noise_std: 0.0
      perturb_init_hand: False
      min_frame: 20
      fixed_frame: 20
    horizon_curriculum:
      enabled: False
    rsi:
      enabled: False
    early_termination:
      enabled: False
  eval:
    sim_backend: cpu
    total_num_envs: 16
    dataset_root: /root/Data/taco-brush-sharpa-20hz-both
    allegro_assets_root: /root/Data/sharpa_mesh/meshes
    robot_name: sharpa
    robot_asset_glob: "*.STL"
    robot_asset_aliases:
      DP_HB1_4F.STL: right_DP.STL
      DP_visual_HB1_4F.STL: right_DP_visual.STL
      DP_HB1_TH.STL: right_thumb_DP.STL
      DP_Visual_HB1_TH.STL: right_thumb_DP_visual.STL
      elastomer_HB1_4F.STL: elastomer.STL
      elastomer_HB1_TH.STL: thumb_elastomer.STL
    trajectory_file: trajectory_mpc_20hz.npz
    pointcloud_dir: 20hz_mpc_pointcloud
    obs_horizon: 4
    hand_dim: 56
    episodes: ["brush__brush__helmet__20231027_011"]
    max_episode_steps: 35
    max_steps_per_rollout_epoch: 36
    reward:
      type: tracking
      tool_pos_weight: 1.0
      target_pos_weight: 1.0
      hand_qpos_weight: 1.0
      tool_pos_scale: 0.05
      target_pos_scale: 0.05
      hand_qpos_scale: 0.35
      contact_weight: 0.0
    single_step:
      enabled: False
    demo_start:
      enabled: True
      hand_obs_noise_std: 0.0
      perturb_init_hand: False
      min_frame: 20
      fixed_frame: 20
    group_size: 1
    is_eval: True
    seed: 1000

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 128
  seed: 42
  enable_offload: False

  model:
    model_path: "/root/flow-policy/outputs/flow-policy/sharpa20hz_tp4/checkpoints/epoch_4100.pt"
    random_init: False
    num_action_chunks: 4
    action_dim: 56
    add_value_head: False
    noise_method: "flow_sde"
    noise_level: 0.5

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
