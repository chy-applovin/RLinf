defaults:
  - env/taco_brush_sharpa@env.train
  - env/taco_brush_sharpa@env.eval
  - model/flow_policy_taco_sharpa@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # Collocated: actor/env/rollout share the same GPUs. Split into separate keys
  # (instead of the combined "actor,env,rollout") so the GPU set is overridable
  # from the CLI, e.g. cluster.component_placement.actor=0-3 (see
  # yjw_scripts/run_sharpa.sh GPU_RANKS). "all" = every detected GPU.
  component_placement:
    actor: all
    env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "taco_sharpa_ppo_flow"
    logger_backends: ["tensorboard"] # add "wandb" once wandb login is configured

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 25
  save_interval: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  rollout_epoch: 1
  eval_rollout_epoch: 1

  # one PPO sample = one executed action chunk (num_action_chunks steps).
  # logprob_type token_level keeps per-element ratios: summing the chunk's
  # 4x56 Gaussian log-prob elements (chunk_level) makes the PPO ratio
  # explode after a few update epochs on this high-dim action space.
  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 10.0 # returns are O(10-100) (tracking reward ~1/step over 160 steps)
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  # sampling/length params are required by the rollout worker interface but
  # unused by the flow policy (its stochasticity comes from noise injection).
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  # Override the default values in env/taco_brush_sharpa
  train:
    total_num_envs: 32
    group_size: ${algorithm.group_size}  # single source of truth: env grouping follows the GRPO group
    max_episode_steps: 160
    max_steps_per_rollout_epoch: 160
  eval:
    total_num_envs: 32
    max_episode_steps: 160
    max_steps_per_rollout_epoch: 160
    group_size: 1
    is_eval: True
    seed: 1000
    one_per_category: True # eval on one episode per category
    video_cfg:
      save_video: False # requires a working GL backend (MUJOCO_GL=glfw + xvfb)
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 1280 # = train.total_num_envs x (max_steps / num_action_chunks)
  seed: 42
  enable_offload: False

  model:
    model_path: "/root/Data/flow-policy-ckpts/taco-brush-sharpa-both-success/epoch_3000.pt"
    num_action_chunks: 4
    add_value_head: True
    noise_method: "flow_sde"
    noise_level: 0.5         # eta: exploration noise scale (START value if annealing)
    # Exploration-noise (eta) schedule. Disabled by default (noise_level_end: null)
    # -> constant eta = noise_level. To enable, set noise_level_end and
    # noise_anneal_steps > 0: the effective eta anneals noise_level (start) ->
    # noise_level_end over [0, noise_anneal_steps] global_steps, then holds.
    noise_level_end: null    # float, e.g. 0.3, to enable annealing
    noise_anneal_steps: 0    # global_steps over which eta anneals start -> end
    noise_schedule: linear   # linear | cosine

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
