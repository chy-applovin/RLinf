actor:
  model:
    model_type: flow_policy_taco
    model_path: /root/flow-policy/outputs/flow-policy/2026-06-10/18-12-14/checkpoints/epoch_800.pt
    random_init: false
    precision: null
    num_action_chunks: 4
    action_dim: 44
    is_lora: false
    num_denoise_steps: 0
    noise_method: flow_sde
    noise_level: 0.5
    safe_get_logprob: false
    ignore_last: false
    add_value_head: true
    detach_critic_input: true
    value_head_hidden_sizes:
    - 256
    - 128
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 16
  global_batch_size: 128
  seed: 42
  enable_offload: false
  optim:
    lr: 1.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 20
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 2-3
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: taco-allegro-flow-rl
    experiment_name: r01-cap16-ue1-step0-h4to200-chunk4-gbs128-brush_bowl
    logger_backends:
    - wandb
    - tensorboard
    wandb_tags:
    - R01
    - step0
    - curriculum
    - cap16
    - update_epoch1
    - object-hand-tracking
    - chunk4
    wandb_notes: 'Round 01 E2: cap PPO training to 16 global batches per rollout pool
      and use update_epoch=1. Tests whether cap8 underuses long-horizon data.

      Reset always starts from demo frame 0; horizon curriculum runs 4->200 control

      steps with action chunk=4. collect_current_horizon_only=True avoids fixed-envelope

      rollout waste. sample_to_global_batch_multiple=True keeps PPO minibatch splitting

      valid, and max_train_global_batches_per_step=16 caps train updates without

      changing rollout collection. Reward tracks both objects and hand qpos. GPUs
      2-3.

      '
  max_epochs: 5000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 500
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 10.0
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /root/flow-policy/outputs/flow-policy/2026-06-10/18-12-14/checkpoints/epoch_800.pt
    precision: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
