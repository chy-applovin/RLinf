    video_num_envs: 4
    render_height: 240
    render_width: 320
  group_name: EnvGroup
actor:
  model:
    model_type: flow_policy_taco
    model_path: /root/flow-policy/outputs/flow-policy/sharpa20hz_tp4/checkpoints/epoch_4100.pt
    random_init: false
    precision: null
    num_action_chunks: 4
    action_dim: 56
    is_lora: false
    num_denoise_steps: 0
    noise_method: flow_sde
    noise_level: 3.0
    safe_get_logprob: false
    ignore_last: false
    add_value_head: false
    detach_critic_input: true
    value_head_hidden_sizes:
    - 256
    - 128
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 16
  global_batch_size: 128
  seed: 42
  enable_offload: false
  optim:
    lr: 1.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 6-7
runner:
  task_type: embodied
  logger:
    log_path: /root/RLinf/logs/sharpa20hz-tp4-box-retadv-f20-h35-eta3-gbs128
    project_name: taco-allegro-flow-rl
    experiment_name: sharpa20hz-tp4-box-retadv-f20-h35-eta3-gbs128
    logger_backends:
    - wandb
    - tensorboard
    wandb_tags:
    - sharpa20hz
    - tp4
    - f20
    - h35
    - eta3
    - fixed-demo-start
    - object-hand-tracking
    - return_as_adv
    - brush__brush__box__20230930_034
    wandb_notes: 'Sharpa 20Hz Tp=4 RL fixed-demo-start run. Episode=brush__brush__box__20230930_034;
      algo=PPO_with_return_as_adv (critic-free return-to-go advantages, no value head).

      Initial IL checkpoint: /root/flow-policy/outputs/flow-policy/sharpa20hz_tp4/checkpoints/epoch_4100.pt.

      Reset initializes the full simulator state from demo frame 20 using demo_start.fixed_frame=20.

      The initial observation history is demo frames 17-20 (obs_horizon=4), matching
      the IL history contract.

      True env episode cap is max_episode_steps=35 control steps. Because action chunk=4,

      max_steps_per_rollout_epoch=36 requests 9 chunk slots; the final slot after
      env done is a no-op.

      Reward tracks tool object, target object, and hand qpos with weights 1/1/1.
      Flow SDE noise_level/eta is 3.0 instead of 0.5. Dataset=/root/Data/taco-brush-sharpa-20hz-both.
      GPUs 6-7.

      '
  max_epochs: 5000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 500
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: ppo_return_as_adv
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 10.0
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /root/flow-policy/outputs/flow-policy/sharpa20hz_tp4/checkpoints/epoch_4100.pt
    precision: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
